# escena_colision.yaml · gemelo de la celda UR3e · generado por el gemelo (IA), BORRADOR
# Robot: nominal (sin identificar: cinemática nominal del UR3e), en la posición B de la celda (derecha en la foto cenital).
# Frame: base_link (sin prefijo, como en sim_<id>). Metros y radianes (REP-103), redondeo a 1 mm y 0,001 rad.
# Huella de la disposición: 4ed74ed6 (FNV-1a de 32 bits de JSON.stringify(L), en UTF-8): casa este fichero con su disposición.
# Carga: un nodo del grupo lo lee con yaml.safe_load, rellena cada moveit_msgs/CollisionObject con rosidl_runtime_py.set_message_fields y los envía con el servicio apply_planning_scene (is_diff: true) [SIN VALIDAR en ROS: U4].
# objetos: lista de moveit_msgs/CollisionObject (moveit_msgs 2.6) en base_link, con header.frame_id, id, pose (la del objeto), primitives y primitive_poses (relativas a pose).
# Sin operation: vale ADD (0) por defecto y ADD con un id que ya existe sustituye el objeto; un byte escrito como entero no pasa por set_message_fields.
# SolidPrimitive: type 1 = BOX [x, y, z], 2 = SPHERE [radio] y 3 = CYLINDER [altura, radio], en m (celda.scene escribe el cilindro al revés: cylinder radio longitud).
# Posiciones a 1 mm; cuaterniones (x, y, z, w) normalizados con 9 decimales, de setRPY con los ángulos a 0,001 rad (los mismos que las TF). Las poses de las formas salen de la pose del objeto ya redondeada.
# Objetos: mesa (BOX), caja_plato_<n> (BOX, solo con los platos sobre caja), plato_<n> (CYLINDER), bandeja (BOX) y camara_<k> (SPHERE y CYLINDER: la cámara y su brazo), sin márgenes de roce.
# La cara de arriba de la mesa queda 1 mm por debajo de base_link, como el suelo del ejemplo del profesor: así la base del robot no arranca en contacto con la mesa.
# plato_1 y plato_2 son obstáculos hasta que se cogen: para cogerlos, adjúntalos a la pinza (AttachedCollisionObject) o permite el contacto en la ACM.
# Fuera de la escena: la persona y la fruta (se mueven o son lo que se coge), la zona de fruta y el otro robot (ya está en el URDF doble, DT16).
# El id suelo es el de la caja del ejemplo del profesor: aquí no se usa (un ADD con el mismo id la sustituiría).
# Giro de las cajas: el del agarre que eligió el plan del gemelo.
# La bandeja va en su pose de plan y cada cámara en la de su TF: las dos son nominales.
# Origen de cada valor, al final de su línea: MEDIDO, FABRICANTE o SUPUESTO; lo que se elige en el gemelo, «elegido en el gemelo».
objetos:
  - header: {frame_id: 'base_link'}  # elegido en el gemelo (el prefijo; base_link es el del URDF)
    id: 'mesa'  # SUPUESTO (id propuesto)
    pose:
      position: {'x': -0.434, 'y': -0.269, 'z': 0.000}  # MEDIDO; la de su TF mesa (centro de la cara de arriba)
      orientation: {'x': 0.000000000, 'y': 0.000000000, 'z': 0.000000000, 'w': 1.000000000}  # MEDIDO
    primitives:
      - {type: 1, dimensions: [1.180, 0.830, 0.760]}  # MEDIDO · BOX [x, y, z]
    primitive_poses:
      - {position: {'x': 0.000, 'y': 0.000, 'z': -0.381}, orientation: {'x': 0.000000000, 'y': 0.000000000, 'z': 0.000000000, 'w': 1.000000000}}  # SUPUESTO (cara de arriba 1 mm por debajo de base_link, como el suelo del profesor); centro a media altura de la mesa
  - header: {frame_id: 'base_link'}  # elegido en el gemelo (el prefijo; base_link es el del URDF)
    id: 'caja_plato_1'  # SUPUESTO (id propuesto)
    pose:
      position: {'x': -0.169, 'y': -0.318, 'z': 0.050}  # SUPUESTO (disposición propuesta, sin medir): bajo su plato; z: SUPUESTO, media altura de la caja
      orientation: {'x': 0.000000000, 'y': 0.000000000, 'z': -0.999841650, 'w': 0.017795386}  # SUPUESTO (giro del plan del gemelo, sin validar): el del agarre que eligió el plan del gemelo
    primitives:
      - {type: 1, dimensions: [0.100, 0.100, 0.100]}  # SUPUESTO · BOX [x, y, z]
    primitive_poses:
