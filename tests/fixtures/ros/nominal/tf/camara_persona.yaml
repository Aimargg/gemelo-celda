# tf/camara_persona.yaml · gemelo de la celda UR3e · generado por el gemelo (IA), BORRADOR
# Robot: nominal (sin identificar: cinemática nominal del UR3e), en la posición B de la celda (derecha en la foto cenital).
# Frame: base_link (sin prefijo, como en sim_<id>). Metros y radianes (REP-103), redondeo a 1 mm y 0,001 rad.
# Huella de la disposición: 4ed74ed6 (FNV-1a de 32 bits de JSON.stringify(L), en UTF-8): casa este fichero con su disposición.
# Carga: ros2 component standalone tf2_ros tf2_ros::StaticTransformBroadcasterNode --ros-args --params-file tf/camara_persona.yaml -r __node:=tf_camara_persona [SIN VALIDAR en ROS: U4].
# TF estática base_link → camara_persona: marco del cuerpo de la cámara persona (REP-103): x hacia donde mira, y a la izquierda, z arriba. nominal: la sustituye la calibración.
# Giro: roll 0.000, pitch -0.044, yaw 0.651 rad (setRPY: R = Rz(yaw)·Ry(pitch)·Rx(roll), ejes fijos), en cuaternión (x, y, z, w) normalizado con 9 decimales.
# Las claves x, y, z y w van entre comillas: YAML 1.1 lee una «y» suelta como true.
# En una escena doble, carga las TF de un solo robot: cada frame admite un único padre.
# Origen de cada valor, al final de su línea: MEDIDO, FABRICANTE o SUPUESTO; lo que se elige en el gemelo, «elegido en el gemelo».
/**:
  ros__parameters:
    frame_id: 'base_link'  # elegido en el gemelo (el prefijo; base_link es el del URDF)
    child_frame_id: 'camara_persona'  # SUPUESTO (nombre propuesto)
    translation:
      'x': -0.134  # SUPUESTO (disposición propuesta, sin medir)
      'y': -0.634  # SUPUESTO (disposición propuesta, sin medir)
      'z': 0.490  # SUPUESTO (disposición propuesta, sin medir)
    rotation:
      'x': 0.007034650  # SUPUESTO (disposición propuesta, sin medir)
      'y': -0.020843120  # SUPUESTO (disposición propuesta, sin medir)
      'z': 0.319705187  # SUPUESTO (disposición propuesta, sin medir)
      'w': 0.947261670  # SUPUESTO (disposición propuesta, sin medir)
