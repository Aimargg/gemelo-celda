          hfov_rad: 1.382  # SUPUESTO (lente ideal, sensor elp-ficha)
          xyz: [0.116, -0.664, 0.490]  # SUPUESTO (disposición propuesta, sin medir)
          rpy: [0.000, 0.600, 1.314]  # SUPUESTO (disposición propuesta, sin medir); marco camara_entrega (REP-103: x hacia donde mira, y a la izquierda, z arriba)
          mira: [0.246, -0.169, 0.140]  # SUPUESTO (disposición propuesta, sin medir)
          orientacion_rad:
