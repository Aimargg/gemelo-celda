          lado_m: 0.060  # SUPUESTO (lado del dibujo del gemelo, sin medir)
          diccionario: 'DICT_4X4_50'  # SUPUESTO (ids propuestos)
      bandeja:
        frame_id: 'bandeja'  # SUPUESTO (nombre propuesto)
        xyz: [0.446, 0.051, 0.240]  # SUPUESTO (disposición propuesta, sin medir)
        yaw: 3.142  # SUPUESTO (disposición propuesta, sin medir)
        zona_primero:
          frame_id: 'zona_primero'  # SUPUESTO (nombre propuesto)
          xyz: [0.466, -0.049, 0.240]  # SUPUESTO (disposición propuesta, sin medir)
        zona_segundo:
          frame_id: 'zona_segundo'  # SUPUESTO (nombre propuesto)
          xyz: [0.466, 0.151, 0.240]  # SUPUESTO (disposición propuesta, sin medir)
        zona_centro:
          frame_id: 'zona_centro'  # SUPUESTO (nombre propuesto)
          xyz: [0.466, 0.051, 0.240]  # SUPUESTO (disposición propuesta, sin medir)
