            inclinacion: 0.988  # SUPUESTO (disposición propuesta, sin medir)
            alabeo: 0.000  # SUPUESTO (disposición propuesta, sin medir)
          pinza_mesa: [-0.264, -0.684, 0.000]  # SUPUESTO (disposición propuesta, sin medir)
        entrega:
