        yaw: 3.142  # SUPUESTO (disposición propuesta, sin medir)
      camaras:
        nombres: ['cenital', 'entrega', 'persona']  # SUPUESTO (nombre propuesto)
        cenital:
          frame_id: 'camara_cenital_optical'  # SUPUESTO (nombre propuesto)
          grupo: 'V2'  # elegido en el gemelo
          modelo: 'ELP-USB12MP01-UFV'  # MEDIDO
          focal_mm: 3.6  # elegido en el gemelo
          modo: '1920x1080'  # elegido en el gemelo
          hfov_rad: 1.382  # SUPUESTO (lente ideal, sensor elp-ficha)
          xyz: [-0.264, -0.439, 0.410]  # SUPUESTO (disposición propuesta, sin medir)
          rpy: [0.000, 0.988, 1.534]  # SUPUESTO (disposición propuesta, sin medir); marco camara_cenital (REP-103: x hacia donde mira, y a la izquierda, z arriba)
          mira: [-0.254, -0.169, 0.000]  # SUPUESTO (disposición propuesta, sin medir)
          orientacion_rad:
