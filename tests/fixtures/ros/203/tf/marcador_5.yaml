# tf/marcador_5.yaml · gemelo de la celda UR3e · generado por el gemelo (IA), BORRADOR
# Robot: 203 (calibration_203.yaml del curso), en la posición B de la celda (derecha en la foto cenital).
# Frame: base_link (sin prefijo, como en sim_<id>). Metros y radianes (REP-103), redondeo a 1 mm y 0,001 rad.
# Huella de la disposición: 38b05d41 (FNV-1a de 32 bits de JSON.stringify(L), en UTF-8): casa este fichero con su disposición.
# Carga: ros2 component standalone tf2_ros tf2_ros::StaticTransformBroadcasterNode --ros-args --params-file tf/marcador_5.yaml -r __node:=tf_marcador_5 [SIN VALIDAR en ROS: U4].
# TF estática base_link → marcador_5: marcador de entrega 5 (DICT_4X4_50), plano sobre la mesa y con sus ejes; convenio de ArUco de OpenCV: z sale de la cara impresa, x a la derecha e y hacia arriba del patrón.
# Giro: roll 0.000, pitch 0.000, yaw 2.356 rad (setRPY: R = Rz(yaw)·Ry(pitch)·Rx(roll), ejes fijos), en cuaternión (x, y, z, w) normalizado con 9 decimales.
# Las claves x, y, z y w van entre comillas: YAML 1.1 lee una «y» suelta como true.
# En una escena doble, carga las TF de un solo robot: cada frame admite un único padre.
# Origen de cada valor, al final de su línea: MEDIDO, FABRICANTE o SUPUESTO; lo que se elige en el gemelo, «elegido en el gemelo».
/**:
  ros__parameters:
    frame_id: 'base_link'  # elegido en el gemelo (el prefijo; base_link es el del URDF)
    child_frame_id: 'marcador_5'  # SUPUESTO (nombre propuesto)
    translation:
      'x': 0.144  # SUPUESTO (disposición propuesta, sin medir)
      'y': 0.308  # SUPUESTO (disposición propuesta, sin medir)
      'z': 0.000  # SUPUESTO (disposición propuesta, sin medir)
    rotation:
      'x': 0.000000000  # SUPUESTO (disposición propuesta, sin medir)
      'y': 0.000000000  # SUPUESTO (disposición propuesta, sin medir)
      'z': 0.923842314  # SUPUESTO (disposición propuesta, sin medir)
      'w': 0.382773273  # SUPUESTO (disposición propuesta, sin medir)
