# tf/bandeja.yaml · gemelo de la celda UR3e · generado por el gemelo (IA), BORRADOR
# Robot: 203 (calibration_203.yaml del curso), en la posición B de la celda (derecha en la foto cenital).
# Frame: base_link (sin prefijo, como en sim_<id>). Metros y radianes (REP-103), redondeo a 1 mm y 0,001 rad.
# Huella de la disposición: 38b05d41 (FNV-1a de 32 bits de JSON.stringify(L), en UTF-8): casa este fichero con su disposición.
# Carga: ros2 component standalone tf2_ros tf2_ros::StaticTransformBroadcasterNode --ros-args --params-file tf/bandeja.yaml -r __node:=tf_bandeja [SIN VALIDAR en ROS: U4].
# TF estática base_link → bandeja: pose de plan de la bandeja (sin balanceo), en la cara de arriba. nominal: la sustituye la pose que publique Visión.
# Giro: roll 0.000, pitch 0.000, yaw -0.785 rad (setRPY: R = Rz(yaw)·Ry(pitch)·Rx(roll), ejes fijos), en cuaternión (x, y, z, w) normalizado con 9 decimales.
# Las claves x, y, z y w van entre comillas: YAML 1.1 lee una «y» suelta como true.
# En una escena doble, carga las TF de un solo robot: cada frame admite un único padre.
# Origen de cada valor, al final de su línea: MEDIDO, FABRICANTE o SUPUESTO; lo que se elige en el gemelo, «elegido en el gemelo».
/**:
  ros__parameters:
    frame_id: 'base_link'  # elegido en el gemelo (el prefijo; base_link es el del URDF)
    child_frame_id: 'bandeja'  # SUPUESTO (nombre propuesto)
    translation:
      'x': -0.351  # SUPUESTO (disposición propuesta, sin medir)
      'y': 0.279  # SUPUESTO (disposición propuesta, sin medir)
      'z': 0.240  # SUPUESTO (disposición propuesta, sin medir)
    rotation:
      'x': 0.000000000  # SUPUESTO (disposición propuesta, sin medir)
      'y': 0.000000000  # SUPUESTO (disposición propuesta, sin medir)
      'z': -0.382499496  # SUPUESTO (disposición propuesta, sin medir)
      'w': 0.923955700  # SUPUESTO (disposición propuesta, sin medir)
