      position: {'x': 0.497, 'y': -0.117, 'z': 0.000}  # SUPUESTO (giro world→base_link sin validar en ROS); la de su TF mesa (centro de la cara de arriba)
      orientation: {'x': 0.000000000, 'y': 0.000000000, 'z': 0.923842314, 'w': 0.382773273}  # SUPUESTO (giro world→base_link sin validar en ROS)
